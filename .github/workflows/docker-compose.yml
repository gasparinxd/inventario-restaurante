name: docker-compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Esperar al backend
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          exit 1

      - name: Probar API
        run: |
          curl -fs -X POST http://localhost:8080/api/productos \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Tomate","unidad":"kg","cantidad":12.5}'
          curl -fs http://localhost:8080/api/productos | grep Tomate

      - name: Probar frontend y proxy /api
        run: |
          curl -fs http://localhost:3000 | grep "<title>Inventario Restaurante</title>"
          curl -fs http://localhost:3000/api/productos | grep Tomate

      - name: Estado y logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Detener servicios
        if: always()
        run: docker compose down -v
